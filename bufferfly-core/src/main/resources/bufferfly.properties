# ============================================================
# BufferFly Core Configuration
# ============================================================
# This file is the classpath default. Override any property in
# your own bufferfly.properties on the classpath, or point
# BufferflyConfigLoader.fromPath() at an external file.
#
# Spring Boot users: these same keys bind automatically via
#   @ConfigurationProperties("bufferfly")
# in the bufferfly-spring-kafka module.
# ============================================================

# --- Actor pool defaults -------------------------------------

# Default mailbox capacity for all actors (number of buffered messages)
bufferfly.actors.default-mailbox-capacity=20000

# Default dispatcher implementation (must have a public no-arg constructor)
bufferfly.actors.default-dispatcher=io.cosmicsilence.bufferfly.core.actor.VTDispatcher

# --- Per-actor overrides (examples — uncomment and adapt) ----
#
# bufferfly.actors.overrides.payment-actor.mailbox-capacity=5000
# bufferfly.actors.overrides.payment-actor.dispatcher=io.cosmicsilence.bufferfly.core.actor.VTDispatcher
#
# bufferfly.actors.overrides.audit-actor.mailbox-capacity=1000
