description = 'Spring Boot auto-configuration wiring BufferFly actors to Apache Kafka partition streams.'

dependencies {
    api project(':bufferfly-core')

    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework:spring-context'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.hsqldb:hsqldb:2.7.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Fork a fresh JVM per test class so each @EmbeddedKafka integration test
    // gets an isolated broker, consumer group and offset state. Without this the
    // two ledger integration tests (which share the 'ledger-events' topic and
    // 'ledger' group) contaminate each other's records within one JVM.
    forkEvery = 1
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}
