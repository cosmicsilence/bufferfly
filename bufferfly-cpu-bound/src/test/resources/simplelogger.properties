# SLF4J Simple console logging for tests — makes BufferFly's framework logs
# (SpinningActorDispatcher and the bufferfly-core classes it exercises) visible
# when running the cpu-bound test suite.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.log.io.bufferfly=info
