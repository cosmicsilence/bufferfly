description = '''\
Performance benchmarks for BufferFly. Not published and not run as part of the \
standard build/test lifecycle — run explicitly with the `benchmarks` task.'''

// -----------------------------------------------------------------------------
// This module hosts the BufferFly benchmarks:
//
//   * PersistenceActorBenchmarkTest          (core: actor batching vs per-row)
//   * DispatcherComparisonBenchmarkTest      (cpu-bound: spinning vs VT dispatch)
//   * PostgresKafkaLedgerBenchmarkTest       (spring-kafka: actor vs per-message consumer)
//   * PostgresKafkaBatchLedgerBenchmarkTest  (spring-kafka: actor vs batching locking consumer)
//   * ShardedActorContainerThroughputBenchmarkTest (spring-kafka: container poll -> route -> commit, no DB)
//   * FlinkVsShardedActorLedgerBenchmarkTest (spring-kafka: sharded actors vs Apache Flink keyed state + JDBC sink)
//
// The benchmarks are long-running and Docker-dependent, so they MUST NOT run on
// `./gradlew build` or `./gradlew test`. The standard `test` task is therefore
// detached from the `check`/`build` lifecycle and the benchmarks are driven by
// the dedicated `benchmarks` task declared at the bottom of this file.
// -----------------------------------------------------------------------------

// A couple of the benchmarks reuse small test-only helper classes that stay in
// their home modules (they are also used by those modules' regular tests):
//   * core:        TweeterActor / Tweet / TweetTransactionalOperations
//   * spring-kafka: io.bufferfly.spring.ledger.AddToAccount
// Pull in their compiled test classes (and transitive test deps) without moving
// the helpers.
dependencies {
    // --- main artifacts under benchmark ---
    implementation project(':bufferfly-core')
    implementation project(':bufferfly-cpu-bound')
    implementation project(':bufferfly-spring-kafka')

    // --- shared test helpers from the home modules ---
    testImplementation project(path: ':bufferfly-core', configuration: 'testArtifacts')
    testImplementation project(path: ':bufferfly-spring-kafka', configuration: 'testArtifacts')

    // --- test harness ---
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.awaitility:awaitility:4.3.0'

    // --- core benchmark (real Postgres via Testcontainers) ---
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.postgresql:postgresql'
    testImplementation 'com.zaxxer:HikariCP'

    // --- spring-kafka benchmark (real Postgres + real Kafka via Testcontainers) ---
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.testcontainers:testcontainers-kafka'

    // --- Flink benchmark (keyed-state ledger vs sharded actors) ---
    // Connector versions are the ones built for Flink 2.2.
    testImplementation 'org.apache.flink:flink-streaming-java:2.2.1'
    testImplementation 'org.apache.flink:flink-clients:2.2.1'
    testImplementation 'org.apache.flink:flink-connector-base:2.2.1'
    testImplementation 'org.apache.flink:flink-connector-kafka:5.0.0-2.2'
    testImplementation 'org.apache.flink:flink-connector-jdbc-core:4.1.0-2.2'

    // Console SLF4J binding so framework logs are visible while benchmarking.
    testRuntimeOnly('org.slf4j:slf4j-simple:2.0.+') {
        because "Spring Boot BOM strips out wildcards for SLF4J modules"
    }
}

configurations.all {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.slf4j') {
                details.useVersion '2.0.+'
            }
            // The Flink Kafka connector asks for a newer kafka-clients; keep the
            // one the framework ships with so every benchmark uses the same client.
            if (details.requested.group == 'org.apache.kafka' && details.requested.name == 'kafka-clients') {
                details.useVersion '4.1.2'
            }
        }
    }
}

// NOTE: the Maven-publish plugin is intentionally NOT applied to this module
// (see the root build.gradle `isPublishable` guard), so `./gradlew publishToMavenCentral`
// during a reckon release never produces or uploads a benchmarks jar.

// Keep the standard `test` task OUT of the build lifecycle: it is detached from
// `check` (wired by the root build.gradle) and disabled so `./gradlew build`
// and `./gradlew test` never run the benchmarks. Disabling `test` makes it a
// no-op wherever it is reached (directly, or via `check`/`build`), so the
// long-running, Docker-dependent benchmarks only ever run through the explicit
// `benchmarks` task below.
tasks.named('test') {
    enabled = false
}

// The dedicated entry point: `./gradlew benchmarks` (or
// `./gradlew :bufferfly-benchmarks:benchmarks`). Runs every *BenchmarkTest in
// a fresh JVM each (the Kafka benchmark needs broker/offset isolation) and
// always streams their stdout reports.
tasks.register('benchmarks', Test) {
    group = 'verification'
    description = 'Runs the BufferFly performance benchmarks (long-running, Docker-dependent).'

    testClassesDirs = sourceSets.test.output.classesDirs
    // Flink's JDBC connector needs openlineage-sql-java, which bundles an old,
    // unshaded copy of commons-lang3. Put the real commons-lang3 jar first so
    // Testcontainers (via commons-compress) does not load the old classes.
    def runtime = sourceSets.test.runtimeClasspath
    classpath = runtime.filter { it.name.startsWith('commons-lang3-') } +
            runtime.filter { !it.name.startsWith('commons-lang3-') }

    useJUnitPlatform()
    include '**/*BenchmarkTest.class'

    // Fork a fresh JVM per benchmark class for broker/offset/JIT isolation.
    forkEvery = 1
    // Benchmarks push millions of messages / 150k rows — give them headroom.
    maxHeapSize = '2g'

    // Forward benchmark tuning properties (e.g. -Dbufferfly.bench.actorBatchSize=250)
    // from the Gradle command line to the forked test JVM.
    System.properties.findAll { it.key.toString().startsWith('bufferfly.bench.') }
            .each { k, v -> systemProperty k.toString(), v }

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }

    // Never cache or skip: a benchmark is only meaningful when actually executed.
    outputs.upToDateWhen { false }
}
